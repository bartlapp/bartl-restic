# Published 0.2.1 controller and native worker, linux/amd64.
image: ghcr.io/bartlapp/bartl-restic-controller@sha256:3ee7994268a23b4beff8a10d6ecc77c13471baa7d4f9e073c4a8dad852deb757
application:
  replicas: 1
# Existing claim; this chart never creates or deletes repository storage.
existingClaim: ""
# Existing kubernetes.io/tls Secret with tls.crt and tls.key.
tlsSecret: ""
# Each repository has an independent native key (Secret key password) and endpoint
# authentication (Secret key htpasswd with reader, writer and admin accounts).
# An empty list runs an idle TLS endpoint, without repository credentials.
repositories: []
# - name: keycloak
#   authSecret: keycloak-repository-auth
#   passwordSecret: keycloak-repository-key
#   recovery:
#     host: backup.secondary.example.com
#     repository: keycloak
#     credentialsSecret: keycloak-secondary-reader

# Optional backend-owned scheduled copies into independently initialized repositories.
# Source Secret needs only password. Destination Secret contains username (writer),
# restPassword, password and ca.crt. No passwords or credentials belong in values.
# Each entry has independent scheduling, native Restic locks and Job/log outcomes.
# Source PVC mounts are read/write solely to permit native lock creation/removal.
# Secondary retention is separate operator maintenance; copy never mirrors deletion.
replication: []
# - name: secondary
#   repository: keycloak
#   sourceCredentialsSecret: keycloak-repository-key
#   destination:
#     host: backup.secondary.example.com
#     repository: keycloak
#     credentialsSecret: keycloak-secondary-writer
#   schedule: "*/15 * * * *"
#   timeZone: Etc/UTC
#   suspend: false
#   activeDeadlineSeconds: 3600
# Jobs forbid overlap per entry, never retry failed Pods, and retain three successful
# and three failed executions. Missed starts expire after 60 seconds.

# Optional one-shot operator-selected maintenance, not scheduled retention.
# Use a unique name for each invocation; Jobs are immutable.
maintenance:
  enabled: false
  name: maintenance
  repository: ""
  # check or forget-prune. forget-prune requires a full 64-character snapshot ID.
  action: check
  snapshot: ""
  # HTTPS DNS name covered by tlsSecret; reachable from the maintenance Pod.
  host: ""
  # Existing Secret: username (admin), restPassword, password, ca.crt.
  credentialsSecret: ""
