apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bartl-restic.name" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bartl-restic.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bartl-restic.name" . }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: require-initialized-repositories
          image: docker.io/library/nginx:1.28.0
          command: [/bin/sh, -ec]
          args:
            - |
              {{- range .Values.repositories }}
              test -s /data/{{ .name }}/config || { echo 'Repository {{ .name }} is missing its config; initialize it explicitly before deployment' >&2; exit 1; }
              for directory in data index keys locks snapshots; do
                test -d /data/{{ .name }}/"$directory" || { echo "Repository {{ .name }} is missing $directory" >&2; exit 1; }
              done
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      containers:
        - name: writer
          image: docker.io/restic/rest-server@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
          command: [rest-server]
          args: [--path, /data, --listen, '127.0.0.1:8000', --no-auth, --append-only]
          volumeMounts:
            - name: data
              mountPath: /data
        - name: repository
          image: docker.io/restic/rest-server@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
          command: [rest-server]
          args: [--path, /data, --listen, '127.0.0.1:8001', --no-auth]
          volumeMounts:
            - name: data
              mountPath: /data
        - name: https
          image: docker.io/library/nginx:1.28.0
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- range .Values.repositories }}
            - name: auth-{{ .name }}
              mountPath: /auth/{{ .name }}
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.existingClaim | quote }}
        - name: nginx
          configMap:
            name: {{ include "bartl-restic.name" . }}
        - name: tls
          secret:
            secretName: {{ .Values.tlsSecret | quote }}
        {{- range .Values.repositories }}
        - name: auth-{{ .name }}
          secret:
            secretName: {{ .authSecret | quote }}
            items:
              - key: htpasswd
                path: htpasswd
        {{- end }}
