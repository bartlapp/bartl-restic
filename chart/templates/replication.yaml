{{- $root := . -}}
{{- $name := include "bartl-restic.name" . -}}
{{- $seen := dict -}}
{{- $routes := dict -}}
{{- $localHosts := list $name (printf "%s.%s" $name .Release.Namespace) (printf "%s.%s.svc" $name .Release.Namespace) (printf "%s.%s.svc.cluster.local" $name .Release.Namespace) -}}
{{- range .Values.replication -}}
{{- if hasKey $seen .name -}}{{- fail "replication entry names must be unique" -}}{{- end -}}
{{- $_ := set $seen .name true -}}
{{- $route := printf "%s|%s|%s" .repository (lower .destination.host) .destination.repository -}}
{{- if hasKey $routes $route -}}{{- fail "replication source/destination pairs must be unique" -}}{{- end -}}
{{- $_ := set $routes $route true -}}
{{- $found := false -}}
{{- $entry := . -}}
{{- range $root.Values.repositories -}}
{{- if eq .name $entry.repository -}}{{- $found = true -}}{{- end -}}
{{- end -}}
{{- if not $found -}}{{- fail "replication.repository must name a declared repository" -}}{{- end -}}
{{- if and (eq .repository .destination.repository) (has (lower .destination.host) $localHosts) -}}
{{- fail "replication destination must not be the same local source repository" -}}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-copy-{{ .name }}
  labels:
    bartl-restic/replication: {{ .name | quote }}
spec:
  schedule: {{ .schedule | quote }}
  timeZone: {{ .timeZone | default "Etc/UTC" | quote }}
  suspend: {{ .suspend | default false }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        bartl-restic/replication: {{ .name | quote }}
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .activeDeadlineSeconds | default 3600 }}
      template:
        metadata:
          labels:
            bartl-restic/replication: {{ .name | quote }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: {{ $name }}
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1
              command: [/bin/sh, -ec]
              args:
                - |
                  test "$RESTIC_REST_USERNAME" = writer || { echo 'Replication requires the destination writer account' >&2; exit 1; }
                  exec restic --cacert /destination/ca.crt --verbose copy --from-repo /source --from-password-file /source-credentials/password
              env:
                - name: RESTIC_REPOSITORY
                  value: {{ printf "rest:https://%s/%s/" .destination.host .destination.repository | quote }}
                - name: RESTIC_PASSWORD_FILE
                  value: /destination/password
                - name: RESTIC_REST_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .destination.credentialsSecret | quote }}
                      key: username
                - name: RESTIC_REST_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .destination.credentialsSecret | quote }}
                      key: restPassword
              volumeMounts:
                - name: source
                  mountPath: /source
                  subPath: {{ .repository | quote }}
                  readOnly: false
                - name: source-credentials
                  mountPath: /source-credentials
                  readOnly: true
                - name: destination
                  mountPath: /destination
                  readOnly: true
          volumes:
            - name: source
              persistentVolumeClaim:
                claimName: {{ $root.Values.existingClaim | quote }}
            - name: source-credentials
              secret:
                secretName: {{ .sourceCredentialsSecret | quote }}
                items:
                  - key: password
                    path: password
            - name: destination
              secret:
                secretName: {{ .destination.credentialsSecret | quote }}
                items:
                  - key: password
                    path: password
                  - key: ca.crt
                    path: ca.crt
{{- end }}
