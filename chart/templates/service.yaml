apiVersion: v1
kind: Service
metadata:
  name: {{ include "bartl-restic.name" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "bartl-restic.name" . }}
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bartl-restic.name" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bartl-restic.name" . }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
