{{- if eq .Values.renderMode "deployment" -}}
{{- $service := include "restic.service" . | fromYaml -}}
{{- $name := include "bartl-restic.name" . }}
apiVersion: restic.bartl.sh/v1alpha1
kind: ResticApplication
metadata:
  name: {{ $name }}
spec:
  replicas: {{ $service.replicas }}
  image: {{ $service.image | quote }}
  existingClaim: {{ $service.existingClaim | quote }}
  tlsSecret: {{ $service.tlsSecret | quote }}
  repositories:
    {{- toYaml $service.repositories | nindent 4 }}
  replication:
    {{- toYaml $service.replication | nindent 4 }}
{{- end }}
