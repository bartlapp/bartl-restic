{{- if eq .Values.renderMode "deployment" }}
{{- $service := include "restic.service" . | fromYaml }}
{{- if $service.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "bartl-restic.name" . }}
spec:
  entryPoints:
    - {{ $service.ingress.entryPoint | quote }}
  routes:
    - match: {{ printf "HostSNI(`%s`)" $service.hostname | quote }}
      services:
        - name: {{ include "bartl-restic.name" . }}
          port: 443
  tls:
    passthrough: true
{{- end }}
{{- end }}
